name: weather-feed
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: weather-feed
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-weather.mjs
        env:
          MET_USER_AGENT: "WellhubCRM-WeatherFeed/1.0 github.com/${{ github.repository }} hiago.branco@gympass.com"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
